[package]
name = "cargo-lbin"
version = "0.1.3"
edition = "2024"
authors = ["Piotr Gorski <piotrgorski@cachyos.org>"]
description = "Thin cargo-install wrapper targeting /usr/local/bin, crates.io only"
repository = "https://github.com/sirlucjan/cargo-lbin"
license = "MIT OR Apache-2.0"
rust-version = "1.91"
categories = ["command-line-utilities"]
include = [
    "/src",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/README.md",
]

[dependencies]
anyhow = "1"
libc = "0.2"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
ureq = { version = "2", features = ["tls", "native-certs"] }

[profile.release]
lto = true
strip = true
