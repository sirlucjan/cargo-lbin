[package]
name = "cargo-lbin"
version = "0.18.0"
edition = "2024"
authors = ["Piotr Gorski <piotrgorski@cachyos.org>"]
description = "Cargo-powered application manager for crates.io command-line binaries"
repository = "https://github.com/sirlucjan/cargo-lbin"
license = "MIT OR Apache-2.0"
rust-version = "1.91"
categories = ["command-line-utilities"]
include = [
    "/src",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/README.md",
]

[features]
default = ["tui"]
# `cargo lbin tui`. Off, the binary is the bare CLI with no terminal UI
# dependencies at all.
tui = ["dep:ratatui"]

[dependencies]
anyhow = "1"
libc = "0.2"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
ureq = { version = "3", features = ["platform-verifier"] }
# unstable-rendered-line-info: Paragraph::line_count — the report panel's
# scroll clamp must count rows the way the wrapper breaks them. "Unstable"
# is ratatui's API-stability marker; a rename fails this build loudly.
ratatui = { version = "0.30.2", optional = true, default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
clap_mangen = "0.3"

[profile.release]
lto = true
strip = true
