[package]
name = "cargo-lbin"
version = "0.5.0"
edition = "2024"
authors = ["Piotr Gorski <piotrgorski@cachyos.org>"]
description = "Thin cargo-install wrapper targeting /usr/local/bin, crates.io only"
repository = "https://github.com/sirlucjan/cargo-lbin"
license = "MIT OR Apache-2.0"
rust-version = "1.91"
categories = ["command-line-utilities"]
include = [
    "/src",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/README.md",
]

[features]
default = ["tui"]
# `cargo lbin tui`. Off, the binary is the bare CLI with no terminal UI
# dependencies at all.
tui = ["dep:ratatui"]

[dependencies]
anyhow = "1"
libc = "0.2"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
ureq = { version = "2", features = ["tls", "native-certs"] }
ratatui = { version = "0.30.2", optional = true, default-features = false, features = ["crossterm"] }

[profile.release]
lto = true
strip = true
